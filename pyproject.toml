[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-check"
version = "1.0.0"
description = "Catch AI-vibecoded slop before it ships, a zero-dependency linter for web projects"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Fabian"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Fayberr/vibe-check"
Repository = "https://github.com/Fayberr/vibe-check"

[project.scripts]
vibe-check = "vibe_check:main"

[tool.setuptools]
py-modules = ["vibe_check"]
